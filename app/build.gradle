plugins { id 'com.android.application' }
def releaseKey = providers.environmentVariable('MUSEDOCK_KEYSTORE').orNull
def googleClient = providers.gradleProperty('googleWebClientId').getOrElse('')
def googleEnabled = !googleClient.isBlank() || providers.gradleProperty('googleSignIn').getOrElse('false').toBoolean()
android {
    namespace 'app.cadence'
    buildFeatures { resValues = true }
    compileSdk 37
    buildToolsVersion "37.0.0"
    defaultConfig {
        applicationId 'app.cadence'
        minSdk 29
        targetSdk 37
        versionCode 10
        versionName '0.9.1'
        resValue 'string', 'app_version', versionName
        resValue 'string', 'google_web_client_id', googleClient
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    sourceSets.main.java.srcDir(googleEnabled ? 'src/google/java' : 'src/noGoogle/java')
    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        debug { enableV2Signing = true; enableV3Signing = true }
        if (releaseKey != null) {
            release {
                storeFile file(releaseKey)
                storePassword providers.environmentVariable('MUSEDOCK_KEYSTORE_PASSWORD').get()
                keyAlias providers.environmentVariable('MUSEDOCK_KEY_ALIAS').getOrElse('androiddebugkey')
                keyPassword providers.environmentVariable('MUSEDOCK_KEY_PASSWORD').get()
                enableV2Signing = true; enableV3Signing = true
            }
        }
    }
    // Never silently replace the published app's signing identity with a freshly generated debug key.
    buildTypes { release { minifyEnabled false; if (releaseKey != null) signingConfig signingConfigs.release } }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            maxHeapSize = '2g'
            maxParallelForks = 1
            // Android 16/17 shared-memory shadows need access to the JDK file-descriptor bridge.
            jvmArgs '--add-exports=java.base/jdk.internal.access=ALL-UNNAMED'
            def testHome = layout.buildDirectory.dir('test-home').get().asFile
            systemProperty 'user.home', testHome.absolutePath
            systemProperty 'musedock.validation.dir', rootProject.file('validation').absolutePath
            doFirst { testHome.mkdirs() }
            systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
            ['https.proxyHost','https.proxyPort','http.proxyHost','http.proxyPort','http.nonProxyHosts'].each { key ->
                if (System.getProperty(key) != null) systemProperty key, System.getProperty(key)
            }
        }
    }
    lint { abortOnError true }
}
dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.core:core:1.15.0'
    implementation project(':extractor')
    if (googleEnabled) {
        implementation 'androidx.credentials:credentials:1.5.0'
        implementation 'androidx.credentials:credentials-play-services-auth:1.5.0'
        implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    }
    implementation 'org.jsoup:jsoup:1.23.2'
    implementation 'de.sciss:jump3r:1.0.5'
    implementation 'androidx.media3:media3-exoplayer:1.7.1'
    implementation 'androidx.media3:media3-session:1.7.1'
    implementation 'androidx.concurrent:concurrent-futures:1.2.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'org.robolectric:robolectric:4.17'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

if (releaseKey != null) {
    tasks.register('verifyReleaseIdentity') {
        doLast {
            def keyStore = java.security.KeyStore.getInstance(file(releaseKey), providers.environmentVariable('MUSEDOCK_KEYSTORE_PASSWORD').get().toCharArray())
            def cert = keyStore.getCertificate(providers.environmentVariable('MUSEDOCK_KEY_ALIAS').getOrElse('androiddebugkey'))
            def digest = java.security.MessageDigest.getInstance('SHA-256').digest(cert.encoded).encodeHex().toString()
            if (digest != '38e32e997464806ba585d116b36dde477b5fc815f4059f793ede084c7114c505') throw new GradleException('Release key does not match the published MuseDock installation. Do not distribute it as an update.')
        }
    }
    tasks.matching { it.name == 'preReleaseBuild' }.configureEach { dependsOn 'verifyReleaseIdentity' }
}
